ShortDescription: Free, open source voice dictation for Brazilian Portuguese that runs 100% on your PC.
Description: |-
  Arara is a free and open source voice dictation app for Brazilian Portuguese (pt-BR).
  Press a shortcut, speak, and the text is typed into any app.
  Speech recognition (Whisper) runs locally: audio and text never leave your computer, and there is no telemetry.
  On first run it downloads the voice model (about 574 MB).
