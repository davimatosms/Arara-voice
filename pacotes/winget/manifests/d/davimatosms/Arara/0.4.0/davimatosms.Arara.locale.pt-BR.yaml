ShortDescription: Ditado por voz em português, grátis e open source, que roda 100% no seu PC.
Description: |-
  O Arara é um app de ditado por voz grátis e open source para português do Brasil.
  Aperte o atalho, fale, e o texto é digitado em qualquer programa.
  O reconhecimento de voz (Whisper) roda no seu computador: o áudio e o texto não saem dele, e não há telemetria.
  Na primeira vez ele baixa o modelo de voz (cerca de 574 MB).
