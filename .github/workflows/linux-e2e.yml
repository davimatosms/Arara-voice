name: linux-e2e
# Teste ponta a ponta do AppImage do Linux (beta): sobe, diagnóstico, Whisper, atalho, colagem X11/Wayland (sway
# headless), --alternar, autostart e atualização. Roda em ubuntu 22.04 e 24.04. Detalhes em .github/linux-e2e/e2e.sh.
on:
  pull_request:
    paths:
      - '.github/workflows/linux-e2e.yml'
      - '.github/linux-e2e/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21.0.13+9.0.LTS'
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Dependências (X11, Wayland, áudio sintético)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils xvfb openbox xdotool libasound2-dev libxtst6 libxi6 libxrender1 \
            libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxt6 libxinerama1 \
            sway xwayland wtype wl-clipboard espeak-ng python3-gi gir1.2-gtk-3.0
          sudo apt-get install -y -qq libfuse2 || sudo apt-get install -y -qq libfuse2t64 # AppImage montado de verdade
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: AppImage e classpath do e2e
        run: |
          ./gradlew :app:appimage -PappimagetoolPath="$RUNNER_TEMP/appimagetool" --no-daemon
          ./gradlew -q :core:e2eCp --no-daemon | sed -n 's/^CP=//p' > "$RUNNER_TEMP/cp.txt"
          ls -l build/linux; test -s "$RUNNER_TEMP/cp.txt"

      - name: E2E
        run: |
          export CP="$(cat "$RUNNER_TEMP/cp.txt")" JAVA="$JAVA_HOME/bin/java"
          bash .github/linux-e2e/e2e.sh build/linux/Arara-x86_64.AppImage "$RUNNER_TEMP/e2e" 2>&1 | tee "$RUNNER_TEMP/e2e.out"
          exit "${PIPESTATUS[0]}"

      - name: Resumo
        if: always()
        run: |
          { echo "### ${{ matrix.os }}"; echo '```'; cat "$RUNNER_TEMP/e2e/resultados.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e/*.log
          if-no-files-found: ignore
