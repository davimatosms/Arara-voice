// Frontend: Swing + FlatLaf, bandeja, janela principal e pop-up da arara.
plugins { id 'application' }
dependencies {
    implementation project(':core')
    implementation 'com.formdev:flatlaf:3.8'
    implementation 'com.formdev:flatlaf-extras:3.8'
}
application { mainClass = 'br.arara.app.Main' }

// ---- Empacotamento para Windows: jpackage (app-image com runtime enxuto) + Inno Setup ----
def versao = version.toString() // gradle.properties
def instaladorDir = rootProject.file('instalador')
def appImageDir = layout.buildDirectory.dir('jpackage')
def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
// jdeps nos jars: base, desktop, logging, net.http, prefs. Mais: EC para o HTTPS do download do
// modelo, localedata (meses em PT-BR no histórico) e accessibility (leitores de tela).
def modulos = 'java.base,java.desktop,java.logging,java.net.http,java.prefs,jdk.crypto.ec,jdk.localedata,jdk.accessibility'
def jlinkOpcoes = '--strip-native-commands --strip-debug --no-man-pages --no-header-files --compress=zip-6 --include-locales=en,pt'

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Gera app/build/jpackage/Arara (Arara.exe + runtime jlink enxuto), sem WiX.'
    dependsOn tasks.named('installDist')
    def lib = layout.buildDirectory.dir('install/app/lib')
    inputs.dir(lib)
    inputs.file(new File(instaladorDir, 'assets/arara.ico'))
    outputs.dir(appImageDir)
    doFirst {
        delete appImageDir
        executable jdk.get().metadata.installationPath.file('bin/jpackage.exe').asFile
        args '--type', 'app-image', '--dest', appImageDir.get().asFile,
                '--name', 'Arara', '--app-version', versao, '--vendor', 'Arara',
                '--description', 'Ditado por voz local em português',
                '--icon', new File(instaladorDir, 'assets/arara.ico'),
                '--input', lib.get().asFile, '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--add-modules', modulos, '--jlink-options', jlinkOpcoes
    }
    doLast {
        // O whisper-jni usa OpenMP (vcomp140.dll), que o JDK não traz e o Windows limpo não tem sem o VC++ Redistributable.
        def vcomp = new File(System.getenv('SystemRoot') ?: 'C:/Windows', 'System32/vcomp140.dll')
        if (!vcomp.exists()) throw new GradleException('vcomp140.dll não achado em ' + vcomp)
        copy { from vcomp; into new File(appImageDir.get().asFile, 'Arara/runtime/bin') }
    }
}

// ---- Empacotamento para macOS (rode num Mac): Arara.app com runtime enxuto e Arara-<versão>-macos-<arq>.dmg ----
// Sem Developer ID: assinatura ad-hoc (codesign -s -), que o Apple Silicon exige para abrir. Veja docs/macos.md.
def macDir = layout.buildDirectory.dir('jpackage-mac')

tasks.register('macAppImage', Exec) {
    description = 'Só o jpackage do Arara.app; use macApp.'
    dependsOn tasks.named('installDist')
    def lib = layout.buildDirectory.dir('install/app/lib')
    inputs.dir(lib)
    inputs.file(new File(instaladorDir, 'assets/arara.icns'))
    outputs.dir(macDir)
    doFirst {
        delete macDir
        executable jdk.get().metadata.installationPath.file('bin/jpackage').asFile
        args '--type', 'app-image', '--dest', macDir.get().asFile,
                // o jpackage recusa versão começando com 0 no macOS; a versão de verdade entra no Info.plist em macApp
                '--name', 'Arara', '--app-version', '1.0.0', '--vendor', 'Arara',
                '--mac-package-identifier', 'br.arara.Arara', '--mac-package-name', 'Arara',
                '--icon', new File(instaladorDir, 'assets/arara.icns'),
                '--input', lib.get().asFile, '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--add-modules', modulos, '--jlink-options', jlinkOpcoes
    }
}

tasks.register('macApp', Exec) {
    group = 'distribution'
    description = 'Gera app/build/jpackage-mac/Arara.app: versão e pedido do microfone no Info.plist, assinatura ad-hoc.'
    dependsOn 'macAppImage'
    def app = macDir.get().file('Arara.app').asFile
    commandLine 'sh', '-eu', '-c', '''
        p="$1/Contents/Info.plist"
        plutil -replace CFBundleShortVersionString -string "$2" "$p"
        plutil -replace CFBundleVersion -string "$2" "$p"
        plutil -replace NSMicrophoneUsageDescription -string "$3" "$p"
        codesign --force --deep --sign - "$1"
        codesign --verify --deep --strict "$1"
    ''', 'sh', app, versao,
            'O Arara ouve o microfone só enquanto você dita, para transcrever no seu Mac. Nada sai do computador.'
}

tasks.register('dmg', Exec) {
    group = 'distribution'
    description = 'Gera build/macos/Arara-<versão>-macos-<arm64|x64>.dmg (Arara.app + atalho para Aplicativos).'
    dependsOn 'macApp'
    def arq = System.getProperty('os.arch') == 'aarch64' ? 'arm64' : 'x64'
    def saida = rootProject.layout.buildDirectory.file("macos/Arara-$versao-macos-${arq}.dmg").get().asFile
    def pasta = layout.buildDirectory.dir('dmg').get().asFile
    outputs.file(saida)
    commandLine 'sh', '-eu', '-c', '''
        rm -rf "$2" "$3"; mkdir -p "$2" "$(dirname "$3")"
        cp -R "$1" "$2/"
        ln -s /Applications "$2/Aplicativos"
        hdiutil create -volname Arara -srcfolder "$2" -fs HFS+ -format UDZO -ov "$3"
    ''', 'sh', macDir.get().file('Arara.app').asFile, pasta, saida
}

tasks.register('instalador', Exec) {
    group = 'distribution'
    description = 'Gera build/instalador/Arara-Setup-<versão>.exe com o Inno Setup 6.7+ (ISCC).'
    // -PappImage=<pasta>: usa um app-image pronto (ex.: o Arara.exe já assinado no CI) em vez de rodar o jpackage
    def pronto = findProperty('appImage')
    def imagem = pronto ? rootProject.file(pronto) : new File(appImageDir.get().asFile, 'Arara')
    if (!pronto) dependsOn 'jpackageImage'
    def saida = rootProject.layout.buildDirectory.dir('instalador')
    inputs.dir(imagem)
    inputs.dir(instaladorDir)
    outputs.dir(saida)
    // -Piscc=C:\...\ISCC.exe; senão o lugar padrão da instalação por usuário; senão o PATH
    def padrao = new File(System.getenv('LOCALAPPDATA') ?: '', 'Programs/Inno Setup 6/ISCC.exe')
    executable(findProperty('iscc') ?: (padrao.exists() ? padrao : 'ISCC.exe'))
    args "/DAppVersion=$versao", "/DAppImage=$imagem", "/O${saida.get().asFile}", '/Q'
    // -PsignedUninstallerDir=<pasta>: desinstalador assinado à parte (veja .github/workflows/instalador.yml)
    if (findProperty('signedUninstallerDir')) args "/DSignedUninstallerDir=${rootProject.file(findProperty('signedUninstallerDir'))}"
    args new File(instaladorDir, 'arara.iss')
}

// ---- Empacotamento para Linux x86_64 (rode no Linux): jpackage app-image + appimagetool -> Arara-x86_64.AppImage ----
// Precisa de -PappimagetoolPath=<arquivo> (o workflow linux.yml baixa a versão fixa e confere o SHA-256).
// Para abrir o AppImage é preciso libfuse2; sem ela: APPIMAGE_EXTRACT_AND_RUN=1 ./Arara-x86_64.AppImage. Veja docs/linux.md.
def linuxDir = layout.buildDirectory.dir('jpackage-linux')

tasks.register('linuxAppImage', Exec) {
    description = 'Só o jpackage (app-image) do Linux; use appimage.'
    onlyIf { System.getProperty('os.name').toLowerCase().contains('linux') }
    dependsOn tasks.named('installDist')
    def lib = layout.buildDirectory.dir('install/app/lib')
    inputs.dir(lib)
    outputs.dir(linuxDir)
    doFirst {
        delete linuxDir
        executable jdk.get().metadata.installationPath.file('bin/jpackage').asFile
        args '--type', 'app-image', '--dest', linuxDir.get().asFile,
                '--name', 'Arara', '--app-version', versao, '--vendor', 'Arara',
                '--icon', new File(instaladorDir, 'assets/icone-256.png'),
                '--input', lib.get().asFile, '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--add-modules', modulos, '--jlink-options', jlinkOpcoes
    }
}

tasks.register('appimage', Exec) {
    group = 'distribution'
    description = 'Gera build/linux/Arara-x86_64.AppImage (-PappimagetoolPath=<appimagetool-x86_64.AppImage>).'
    onlyIf { System.getProperty('os.name').toLowerCase().contains('linux') }
    dependsOn 'linuxAppImage'
    def tool = findProperty('appimagetoolPath')
    def saida = rootProject.layout.buildDirectory.file('linux/Arara-x86_64.AppImage').get().asFile
    def appDir = layout.buildDirectory.dir('AppDir').get().asFile
    // Sem inputs o Gradle marcava UP-TO-DATE e o AppImage ficava com o código antigo.
    inputs.dir(linuxDir)
    inputs.file(new File(instaladorDir, 'assets/icone-256.png'))
    outputs.file(saida)
    environment 'APPIMAGE_EXTRACT_AND_RUN', '1'; environment 'ARCH', 'x86_64' // sem FUSE no CI
    doFirst { if (!tool) throw new GradleException('Passe -PappimagetoolPath=<appimagetool-x86_64.AppImage>') }
    commandLine 'sh', '-eu', '-c', '''
        rm -rf "$2"; mkdir -p "$2" "$(dirname "$4")"
        cp -a "$1/Arara/." "$2/"
        cp "$5" "$2/Arara.png"
        cat > "$2/Arara.desktop" <<'EOT'
[Desktop Entry]
Type=Application
Name=Arara
Comment=Ditado por voz local em português
Exec=Arara
Icon=Arara
Categories=Utility;AudioVideo;
Terminal=false
EOT
        printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/bin/Arara" "$@"\n' > "$2/AppRun"
        chmod +x "$2/AppRun"
        "$3" "$2" "$4"
    ''', 'sh', linuxDir.get().asFile, appDir, tool ?: '', saida, new File(instaladorDir, 'assets/icone-256.png')
}
